<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор QR-кодов</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 32px;
    width: 100%;
    max-width: 460px;
    text-align: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #333;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: #888;
    font-size: 14px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #667eea;
  }
  button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #667eea;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  button:hover { background: #5568d3; }
  button:active { transform: scale(0.97); }
  button:disabled {
    background: #bbb;
    cursor: not-allowed;
  }
  #qr-container {
    margin: 20px auto 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #qr-container img,
  #qr-container canvas {
    border-radius: 8px;
    padding: 8px;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  #download-btn {
    background: #28a745;
    display: none;
  }
  #download-btn:hover { background: #218838; }
  #error {
    color: #e53935;
    font-size: 14px;
    margin-top: 12px;
    min-height: 18px;
  }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔗 Генератор QR-кода</h1>
  <p class="subtitle">Введите URL и получите QR-код</p>

  <div class="input-group">
    <input
      type="text"
      id="url-input"
      placeholder="https://example.com"
      autocomplete="off"
    >
    <button id="generate-btn">Создать</button>
  </div>

  <div id="error"></div>

  <div id="qr-container">
    <button id="download-btn">⬇️ Скачать PNG</button>
  </div>

  <div class="footer">QR-код генерируется локально в вашем браузере</div>
</div>

<!-- Библиотека QRCode.js -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<!-- Библиотека html2canvas для сохранения в PNG -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
(function () {
  const input        = document.getElementById('url-input');
  const generateBtn  = document.getElementById('generate-btn');
  const downloadBtn  = document.getElementById('download-btn');
  const qrContainer  = document.getElementById('qr-container');
  const errorEl      = document.getElementById('error');

  // Храним canvas с последним QR-кодом
  let currentCanvas = null;

  /**
   * Проверка корректности URL
   */
  function isValidUrl(str) {
    if (!str) return false;
    let url = str.trim();
    // Разрешаем ввод без схемы (например, "youtube.com"), добавляя http://
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    try {
      const u = new URL(url);
      return (u.protocol === 'http:' || u.protocol === 'https:') && !!u.hostname;
    } catch (e) {
      return false;
    }
  }

  /**
   * Нормализация URL (добавляем https:// если нет схемы)
   */
  function normalizeUrl(str) {
    let url = str.trim();
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }
    return url;
  }

  /**
   * Очистка контейнера от старого QR-кода
   */
  function clearQr() {
    qrContainer.querySelectorAll('canvas, img').forEach(el => el.remove());
    currentCanvas = null;
    downloadBtn.style.display = 'none';
  }

  /**
   * Генерация QR-кода
   */
  function generateQr() {
    errorEl.textContent = '';
    const raw = input.value.trim();

    if (!raw) {
      errorEl.textContent = '⚠️ Введите URL';
      clearQr();
      return;
    }

    if (!isValidUrl(raw)) {
      errorEl.textContent = '❌ Некорректный URL. Пример: https://example.com';
      clearQr();
      return;
    }

    const url = normalizeUrl(raw);
    clearQr();

    // Создаём временный элемент для генерации
    const tmp = document.createElement('div');
    tmp.style.display = 'none';
    document.body.appendChild(tmp);

    try {
      new QRCode(tmp, {
        text: url,
        width: 256,
        height: 256,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      errorEl.textContent = '❌ Ошибка генерации: ' + e.message;
      tmp.remove();
      return;
    }

    // QRCode.js генерирует либо canvas (в современных браузерах), либо img
    // Даём небольшую задержку, чтобы код успел отрисоваться
    setTimeout(() => {
      const canvas = tmp.querySelector('canvas');
      const img    = tmp.querySelector('img');

      if (canvas) {
        // Переносим canvas в основной контейнер
        canvas.style.display = 'block';
        qrContainer.insertBefore(canvas, downloadBtn);
        currentCanvas = canvas;
        downloadBtn.style.display = 'inline-block';
      } else if (img) {
        // Fallback: используем img
        img.style.display = 'block';
        qrContainer.insertBefore(img, downloadBtn);
        // Конвертируем img в canvas для скачивания
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || 256;
        c.height = img.naturalHeight || 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0);
        currentCanvas = c;
        downloadBtn.style.display = 'inline-block';
      } else {
        errorEl.textContent = '❌ Не удалось отрисовать QR-код';
      }

      tmp.remove();
    }, 50);
  }

  /**
   * Скачивание QR-кода в PNG
   */
  function downloadQr() {
    if (!currentCanvas) return;

    const url = normalizeUrl(input.value.trim());

    // Формируем читаемое имя файла из домена
    let filename = 'qr_code.png';
    try {
      const u = new URL(url);
      filename = 'qr_' + u.hostname.replace(/[^a-z0-9.-]/gi, '_') + '.png';
    } catch (e) { /* ignore */ }

    try {
      const link = document.createElement('a');
      link.download = filename;
      link.href = currentCanvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    } catch (e) {
      errorEl.textContent = '❌ Ошибка скачивания: ' + e.message;
    }
  }

  // Обработчики событий
  generateBtn.addEventListener('click', generateQr);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') generateQr();
  });
  downloadBtn.addEventListener('click', downloadQr);
})();
</script>

</body>
</html>
